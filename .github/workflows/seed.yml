name: Seed D1

on:
  push:
    branches:
      - master
    paths:
      - seeds/seed.sql
      - scripts/seed.mjs
      - .github/workflows/seed.yml
  release:
    types: [published]

permissions:
  contents: read

env:
  # Enable only after remote databases, migrations and environment secrets are configured.
  SEEDING_ENABLED: "false"
  HUSKY: "0"
  CLOUDFLARE_SEND_METRICS: "false"

jobs:
  validate:
    name: Validate seed target
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate seed and report target
        env:
          SEED_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || 'staging' }}
          SEED_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SEED_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/seed.mjs --check

      - name: Record whether writes are enabled
        id: flag
        run: echo "enabled=$SEEDING_ENABLED" >> "$GITHUB_OUTPUT"

  seed:
    name: Seed selected environment
    needs: validate
    if: needs.validate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    concurrency:
      group: d1-seed-${{ github.event_name == 'release' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Seed selected remote D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SEED_ENVIRONMENT: ${{ github.event_name == 'release' && 'production' || 'staging' }}
          SEED_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SEED_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/seed.mjs
