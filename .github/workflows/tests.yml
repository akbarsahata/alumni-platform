name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: "0"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Create a synthetic local environment
        run: npm run local:setup

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run helper tests
        run: npm run test:unit

  integration:
    name: Integration (${{ matrix.context }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        context: [auth, membership, directory, outreach]
    env:
      HUSKY: "0"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Create a synthetic local environment
        run: npm run local:setup

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run context HTTP and browser tests
        run: npm test -- --context ${{ matrix.context }}

  tests:
    # Stable required check: fail if any prerequisite failed or was skipped.
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all stages to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
