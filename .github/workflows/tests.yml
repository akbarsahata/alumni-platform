name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: "0"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Create a synthetic local environment
        run: npm run local:setup

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run helper tests
        run: npm run test:unit

  integration:
    name: Integration (${{ matrix.context }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        context: [auth, membership, directory, outreach]
    env:
      HUSKY: "0"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Create a synthetic local environment
        run: npm run local:setup

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run context HTTP and browser tests
        run: npm test -- --context ${{ matrix.context }}

  tests:
    # Stable required check: fail if any prerequisite failed or was skipped.
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all stages to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success

  deploy-staging:
    name: Deploy staging
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      HUSKY: "0"
      CLOUDFLARE_SEND_METRICS: "false"
      CLOUDFLARE_ENV: staging
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check current master revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "This run is still the latest master commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale staging deployment for \`$GITHUB_SHA\`; \`master\` is now \`$latest\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy staging
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run deploy:staging

  verify-release:
    name: Verify production release
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Require a non-prerelease v* tag on master
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          test "$RELEASE_PRERELEASE" = "false"
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must match v*." >&2
              exit 1
              ;;
          esac
          git cat-file -e "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          echo "Release $RELEASE_TAG is a non-prerelease tag on master."

  deploy-production:
    name: Deploy production
    needs: [tests, verify-release]
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HUSKY: "0"
      CLOUDFLARE_SEND_METRICS: "false"
      CLOUDFLARE_ENV: production
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run deploy:production
